name: Build

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Free up disk space in runner
      uses: ./.github/actions/disk-cleanup

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Locate Gradle dependency cache
      id: gradle-cache
      run: |
        if [ -d "$HOME/.gradle/caches" ]; then
          echo "ctx=gradle-ro-cache=$HOME/.gradle/caches" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the toolchain
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: Dockerfile.android
        target: toolchain
        outputs: type=cacheonly
        # cache-from: type=gha,scope=ringrtc-builder
        # cache-to: type=gha,scope=ringrtc-builder,mode=max

    - name: Assemble and test
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: Dockerfile.android
        target: test
        outputs: type=cacheonly
        build-contexts: ${{ steps.gradle-cache.outputs.ctx }}
        # cache-from: type=gha,scope=ringrtc-builder

    - name: Export assembled artifacts
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: Dockerfile.android
        target: artifacts
        outputs: type=local,dest=artifacts
        provenance: false
        build-contexts: ${{ steps.gradle-cache.outputs.ctx }}
        # cache-from: type=gha,scope=ringrtc-builder

    - name: List artifact checksums
      working-directory: artifacts
      run: |
        find . -type f -printf '%P\0' | sort -z | xargs -0 -r sha256sum -b --

    - name: Archive release artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ringrtc-artifacts
        path: artifacts
        if-no-files-found: error
